<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="athena-token" content="__ATHENA_TOKEN__"><title>Инструменты агента · Athena</title><link rel="stylesheet" href="/style.css"><style>body{overflow:auto}article{max-width:1100px;margin:36px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between}#tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:24px 0}.tool{border:1px solid var(--border,#343a46);border-radius:10px;padding:16px}.tool h3{margin:0 0 8px}.tool p{line-height:1.5}.badge{font-size:12px;color:#b6a2f8}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:200px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:450px;overflow:auto}details{margin-top:14px}#notice{line-height:1.6}</style></head><body><article><header><h1>Инструменты агента</h1><a href="/">Вернуться в IDE →</a></header><p id="notice" role="status">Получаем состояние проекта…</p><p class="muted">Агент читает проект и готовит предложения в наборах изменений. Проверка и загрузка в 1С доступны пользователю в «Правках». Автономный цикл модели — следующий этап.</p><h2>Проверить поиск</h2><form id="search"><input id="query" required maxlength="500" placeholder="Имя функции или фрагмент кода" aria-label="Запрос"><select id="scope" aria-label="Область поиска"><option value="code">Код проекта</option><option value="metadata">Метаданные</option><option value="platform">Синтаксис-помощник</option></select><select id="source" aria-label="Версия платформы"></select><button class="primary">Найти</button></form><pre id="result" hidden></pre><div id="tools"></div><details><summary>Последние вызовы</summary><button id="refresh">Обновить журнал</button><pre id="history"></pre></details></article><script src="/agent-tools.js"></script></body></html>
