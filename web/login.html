<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="athena-token" content="__ATHENA_TOKEN__"><title>Athena · Вход</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14171e;color:#e2e8f3;font:14px system-ui}main{width:min(390px,92vw);padding:34px;border:1px solid #394052;border-radius:20px;background:#1d2330}h1{font-size:28px;margin:0 0 8px}p{color:#9faec5;line-height:1.7}label{display:grid;gap:8px;margin:18px 0}input,button{padding:12px;border-radius:9px;border:1px solid #414b60;font:inherit}input{background:#141b26;color:#e2e8f3}button{width:100%;background:#ae98ec;color:#141621;cursor:pointer;font-weight:600}#status{min-height:22px;color:#e3b4b4}</style></head><body><main><h1>Athena</h1><p>Войдите в рабочее пространство</p><form><label>Логин<input name="login" autocomplete="username" required autofocus maxlength="64"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>Войти</button><p id="status" role="status"></p></form></main><script>
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-Athena-Token':document.querySelector('meta[name=athena-token]').content},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();if(!response.ok)throw Error(data.error);location.replace('/');}catch(error){document.querySelector('#status').textContent=error.message;}finally{b.disabled=false;}};
</script></body></html>
